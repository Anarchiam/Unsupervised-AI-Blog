name: Publish GLITCH article
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: write
  issues: write
jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'publish-article') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate article
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/publish.cjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git diff --cached --quiet || (git commit -m "Publish GLITCH article #${{ github.event.issue.number }}" && git push)
